name: Update Casks

on:
  schedule:
    # UTC 04:00 / 10:00 / 16:00 / 22:00 = UTC+8 12:00 / 18:00 / 00:00 / 06:00.
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Casks/**"

permissions:
  contents: read

concurrency:
  group: update-casks
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  prepare:
    name: Prepare and audit update
    if: github.repository == 'Axolotl-Launcher/homebrew-tap' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Homebrew tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/axolotl-launcher"
          ln -s "$GITHUB_WORKSPACE" \
            "$(brew --repository)/Library/Taps/axolotl-launcher/homebrew-tap"
          if brew help trust > /dev/null 2>&1; then
            brew trust --cask Axolotl-Launcher/tap/axolotl-launcher
          fi

      - name: Test updater
        run: python3 -B -m unittest discover -s tests -v

      - name: Update Casks and README
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: python3 -B scripts/update_casks.py update

      - name: Audit proposed contents
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in Casks/*.rb; do
            token="$(basename "$file" .rb)"
            ruby -c "$file"
            brew style --cask "Axolotl-Launcher/tap/$token"
            brew audit --cask --strict --online "Axolotl-Launcher/tap/$token"
          done

      - name: Export audited proposal
        run: |
          python3 -B scripts/update_casks.py export --proposal "$RUNNER_TEMP/cask-proposal"

      - name: Upload audited data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cask-proposal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cask-proposal
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified update
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write # Dispatch read-only CI on the verified PR head.

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download audited data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cask-proposal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cask-proposal

      # This job only handles data and Git operations; it never evaluates Cask Ruby.
      - name: Apply audited proposal
        run: |
          python3 -B scripts/update_casks.py apply --proposal "$RUNNER_TEMP/cask-proposal"
          cp scripts/update_casks.py "$RUNNER_TEMP/verify-cask-update.py"
          cp "$RUNNER_TEMP/cask-proposal/manifest.json" "$RUNNER_TEMP/cask-update.json"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-casks
          delete-branch: true
          add-paths: |
            Casks/*.rb
            README.md
          commit-message: "chore: update casks"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "chore: update casks and application list"
          body: |
            Automated Cask updates and generated README application tables.

            The proposed contents passed Ruby syntax, style and strict online
            Homebrew audits in a read-only job. The publishing job verifies that
            the actual PR matches those contents without evaluating Cask Ruby.
            Maintainers review and merge the PR; automatic merging is optional.

      - name: Checkout update PR commit
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.cpr.outputs.pull-request-head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify actual update PR
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json baseRefName,headRefName,isCrossRepository |
            jq -e --arg base "$BASE_BRANCH" '
              .baseRefName == $base and .headRefName == "automation/update-casks" and
              .isCrossRepository == false
            ' > /dev/null
          python3 -B "$RUNNER_TEMP/verify-cask-update.py" verify \
            --root "$GITHUB_WORKSPACE" --manifest "$RUNNER_TEMP/cask-update.json"

      - name: Run CI on verified update PR
        if: vars.AUTO_MERGE_UPDATES == 'true' && steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/update-casks
          run_id=""
          for attempt in {1..24}; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch automation/update-casks --event workflow_dispatch --limit 20 \
              --json databaseId,headSha,createdAt | \
              jq -r --arg head "$PR_HEAD" --arg since "$dispatched_at" \
                '[.[] | select(.headSha == $head and .createdAt >= $since)][0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "No CI run found for the verified PR commit; leaving the PR open."
            exit 1
          fi
          timeout 600 gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion | \
            jq -e --arg head "$PR_HEAD" ' .headSha == $head and .conclusion == "success"' > /dev/null

      - name: Merge verified update PR
        if: vars.AUTO_MERGE_UPDATES == 'true' && steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.cpr.outputs.pull-request-head-sha }}
          EXPECTED_BASE: ${{ github.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          current_base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_BRANCH" --jq .object.sha)"
          if [[ "$current_base" != "$EXPECTED_BASE" ]]; then
            echo "Default branch changed after preparation; leaving the PR for review."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$PR_HEAD"
